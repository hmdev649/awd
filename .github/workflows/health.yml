# Visits every listing's website and source links once a week and keeps the
# "Listing health" issue up to date. It changes no files and can't affect the
# live site. Run it by hand from the Actions tab with "Run workflow".
name: Listing health check

on:
  schedule:
    # Mondays 13:23 UTC, ahead of the weekly rebuild
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
